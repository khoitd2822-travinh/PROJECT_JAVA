[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
extra_scripts = pre:../scripts/pio_auto_local_config.py
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    bblanchon/ArduinoJson@^6.21.5

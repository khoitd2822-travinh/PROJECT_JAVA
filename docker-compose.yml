name: swiftletcare

services:
  emqx:
    image: emqx/emqx:${EMQX_VERSION:-5.8.6}
    container_name: swiftlet-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-swiftlet123}
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log

  timescaledb:
    image: timescale/timescaledb:${TIMESCALE_TAG:-latest-pg16}
    container_name: swiftlet-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swiftlet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swiftlet123}
      POSTGRES_DB: ${POSTGRES_DB:-swiftlet}
    volumes:
      - timescale_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: swiftlet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  s3:
    image: zenko/cloudserver:latest
    container_name: swiftlet-s3
    restart: unless-stopped
    ports:
      - "9000:8000"
    environment:
      S3DATASTORE: local
      ENDPOINT: localhost
      SCITYPE: local
      ENDPOINT_PORT: "9000"
      ACCESS_KEY_ID: "123"
      SECRET_ACCESS_KEY: "abc"
    volumes:
      - s3_data:/usr/src/app/localData
      - s3_meta:/usr/src/app/localMetadata

volumes:
  emqx_data:
  emqx_log:
  timescale_data:
  redis_data:
  s3_data:
  s3_meta:
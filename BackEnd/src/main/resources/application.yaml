server:
  port: 8080

spring:
  application:
    name: BackEnd

  # 1. Cấu hình kết nối TimescaleDB (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/swiftlet
    username: swiftlet
    password: swiftlet123
    driver-class-name: org.postgresql.Driver

  # 2. Cấu hình JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 3. Cấu hình Redis Cache
  data:
    redis:
      host: localhost
      port: 6379

# 4. Cấu hình MQTT EMQX Broker
# BROKER + TENANT phải KHỚP với firmware/esp32-main/include/mqtt_config.h
#   -> do doi MOT CHO: sua ca 2 ben cung luc
mqtt:
  broker-url: tcp://localhost:1883
  client-id: swiftletcare_backend_consumer
  tenant: thanhliem
  topic:
    telemetry: swiftlet/thanhliem/+/+/telemetry
    detection: swiftlet/thanhliem/#/detection
    status: swiftlet/thanhliem/+/+/status

# 5. Cấu hình S3 Storage (Zenko Cloudserver)
s3:
  endpoint: http://localhost:9000
  access-key: "123"
  secret-key: "abc"
  bucket-name: swiftlet-alerts